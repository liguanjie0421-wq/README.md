<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>購屋房貸試算</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e2e1dc;--ok:#1a7f4b;--bad:#c0392b;--warn:#b7791f;--ac:#2f5bd8}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--tx:#eeeeea;--mut:#9a9a93;--bd:#33332f;--ok:#4cc38a;--bad:#ff7a6b;--warn:#e6b450;--ac:#7a9cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut)}
input,select{width:100%;padding:8px;margin-top:3px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.verdict{font-size:18px;font-weight:700;margin:0 0 10px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
.scroll{overflow:auto;max-height:420px}
.wrap{overflow-x:auto}
ul{margin:6px 0 0;padding-left:20px}li{margin:3px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:10px}
.kv div{border:1px solid var(--bd);border-radius:8px;padding:8px 10px}.kv b{display:block;font-size:17px}.kv span{font-size:12px;color:var(--mut)}
.hl{background:rgba(192,57,43,.13)}
small{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>購屋房貸試算</h1>
<p class="sub">房貸金額由「房價 × 成數」自動計算；攤還表會隨年限與還款頻率自動增減期數。</p>

<section class="card"><h2>參數</h2>
<div class="grid" id="inputs"></div></section>

<section class="card"><h2>結論</h2><div id="verdict"></div></section>
<section class="card"><h2>房貸摘要與核對</h2><div id="summary"></div></section>
<section class="card"><h2>利率 × 年限壓力表（每月等值月付金）</h2><div class="wrap" id="stress"></div>
<small>紅底＝月付金加生活支出超過月收入。</small></section>
<section class="card"><h2>攤還表</h2><div class="scroll" id="amort"></div></section>
<section class="card"><h2>模型未涵蓋的風險</h2>
<ul>
<li>稅負與勞健保：此處收入視為可支配收入；若為稅前請先扣除。</li>
<li>持有成本：房屋稅、地價稅、管理費、保險、修繕、換屋或空窗期。</li>
<li>利率調升與寬限期結束後月付金上升；失業、減薪、生病等收入中斷。</li>
<li>房價下跌、流動性與賣出成本；不買房時的租金對照。</li>
<li>通膨、薪資成長、退休與其他儲蓄目標。</li>
</ul></section>
</main>
<script>
const F=[
 ['age','目前年齡(年)',25,1],['expense','非房貸生活支出(月)',25000,1000],
 ['price','預計購屋總價值',12000000,100000],['rate','房貸年利率(%)',2.5,0.05],
 ['ret','儲蓄/投資年報酬率(%)',4,0.1],['income','每月收入',65000,1000],
 ['assets','目前金融資產',1000000,10000],['ltv','房貸成數(%)',75,1],
 ['years','房貸年限(年)',30,1],['horizon','長期分析期間(年)',20,1],
 ['cost','交易成本占房價(%)',4,0.1],['reserve','緊急預備金(月生活費倍數)',6,1]
];
const root=document.getElementById('inputs');
F.forEach(([k,l,v,s])=>root.insertAdjacentHTML('beforeend',`<label>${l}<input id="${k}" type="number" step="${s}" value="${v}"></label>`));
root.insertAdjacentHTML('beforeend',`<label>還款頻率<select id="freq"><option value="12">月繳</option><option value="4">季繳</option><option value="1">年繳</option></select></label>`);
const $=id=>document.getElementById(id);
const N=id=>parseFloat($(id).value)||0;
const f0=x=>Math.round(x).toLocaleString('zh-TW');
const pct=x=>(x*100).toFixed(1)+'%';
function pmt(r,n,pv){return r===0?pv/n:pv*r/(1-Math.pow(1+r,-n))}
function monthlyEq(rate,years,loan){return pmt(rate/12,years*12,loan)}

function run(){
 const price=N('price'),loan=price*N('ltv')/100,rate=N('rate')/100,years=Math.max(1,Math.round(N('years'))),c=+$('freq').value;
 const income=N('income'),exp=N('expense'),assets=N('assets');
 const n=years*c,r=rate/c,P=pmt(r,n,loan);
 // 攤還表
 let bal=loan,sumP=0,sumI=0,sumPay=0,rows='';
 for(let k=1;k<=n;k++){
  const i=bal*r,pr=P-i;bal-=pr;sumI+=i;sumP+=pr;sumPay+=P;
  rows+=`<tr><td>${k}</td><td>${f0(bal<0.005?0:bal)}</td><td>${f0(i)}</td><td>${f0(pr)}</td><td>${f0(P)}</td></tr>`;
 }
 $('amort').innerHTML=`<table><thead><tr><th>期數</th><th>期末尚欠</th><th>本期利息</th><th>本期本金</th><th>本期付款</th></tr></thead><tbody>${rows}</tbody></table>`;
 // 核對
 const chk=[
  ['最後一期餘額≈0',Math.abs(bal)<1,`${bal.toFixed(6)}`],
  ['本金加總＝貸款金額',Math.abs(sumP-loan)<1,`${f0(sumP)} / ${f0(loan)}`],
  ['付款加總＝本金＋利息',Math.abs(sumPay-(sumP+sumI))<1,`${f0(sumPay)} / ${f0(sumP+sumI)}`]];
 const mEq=P*c/12;
 const down=price-loan,costAmt=price*N('cost')/100,reserve=N('reserve')*exp,cashNeed=down+costAmt;
 const gap=cashNeed+reserve-assets;
 const dti=income>0?mEq/income:0,left=income-exp-mEq;
 $('summary').innerHTML=`<div class="kv">
 <div><span>房貸金額</span><b>${f0(loan)}</b></div>
 <div><span>每期還款（${$('freq').selectedOptions[0].text}）</span><b>${f0(P)}</b></div>
 <div><span>每月等值月付金</span><b>${f0(mEq)}</b></div>
 <div><span>利息總額</span><b>${f0(sumI)}</b></div>
 <div><span>自備款</span><b>${f0(down)}</b></div>
 <div><span>交易成本</span><b>${f0(costAmt)}</b></div></div>
 <p>${chk.map(x=>`<span class="${x[1]?'ok':'bad'}">${x[1]?'✔':'✘'} ${x[0]}（${x[2]}）</span>`).join('<br>')}</p>`;
 // 結論
 const issues=[];
 if(gap>0)issues.push(`自備款＋交易成本＋預備金共需 ${f0(cashNeed+reserve)}，現有資產 ${f0(assets)}，缺口 ${f0(gap)}`);
 if(dti>0.35)issues.push(`月付金占收入 ${pct(dti)}，高於 35% 的一般上限`);
 if(left<0)issues.push(`扣除生活費與房貸後每月赤字 ${f0(-left)}`);
 else if(left<income*0.1)issues.push(`每月剩餘僅 ${f0(left)}（占收入 ${pct(left/Math.max(income,1))}），緩衝偏薄`);
 const ok=issues.length===0;
 // 長期：購屋後資產（現有資產 - 現金支出 + 每月剩餘投資）
 let a=assets-cashNeed;const rm=N('ret')/100/12,H=Math.round(N('horizon'));
 for(let m=0;m<H*12;m++)a=a*(1+rm)+left;
 // 房價上限
 const maxByCash=(assets-reserve)/(1-N('ltv')/100+N('cost')/100);
 const maxByDti=(()=>{const m=0.33*income;const L=m*(1-Math.pow(1+rate/12,-years*12))/(rate/12||1e-12);return L/(N('ltv')/100)})();
 $('verdict').innerHTML=`<p class="verdict ${ok?'ok':'bad'}">${ok?'目前參數下可行':'目前參數下不可行'}</p>
 ${ok?'':'<ul>'+issues.map(s=>`<li>${s}</li>`).join('')+'</ul>'}
 <p>估計房價上限：依現金約 <b>${f0(Math.max(0,maxByCash))}</b>；依月付金≤收入 33% 約 <b>${f0(maxByDti)}</b>；實際取較低者 <b>${f0(Math.max(0,Math.min(maxByCash,maxByDti)))}</b>。</p>
 <p>${H} 年後金融資產（購屋現金支出後，剩餘全數以 ${N('ret')}% 投資）：<b class="${a<0?'bad':''}">${f0(a)}</b></p>`;
 // 壓力表
 const rates=[2,2.5,3,3.5,4,4.5],ys=[20,25,30,35];
 let t='<table><thead><tr><th>年限＼利率</th>'+rates.map(x=>`<th>${x}%</th>`).join('')+'</tr></thead><tbody>';
 ys.forEach(y=>{t+=`<tr><td>${y} 年</td>`+rates.map(x=>{const m=monthlyEq(x/100,y,loan);return `<td class="${income-exp-m<0?'hl':''}">${f0(m)}</td>`}).join('')+'</tr>'});
 $('stress').innerHTML=t+'</tbody></table>';
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',run));
run();
</script>
</body>
</html>
